<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AI Resume Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">⚡ ResumeAI</a>
            <ul class="navbar-menu">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="upload.html" class="navbar-link">Upload</a></li>
                <li><a href="dashboard.html" class="navbar-link">Dashboard</a></li>
                <li><a href="signin.html" class="navbar-link active">Sign In</a></li>
            </ul>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card fade-in">
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your career dashboard</p>

            <form id="signinForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <button type="submit" class="btn btn-primary btn-full" id="signinBtn">
                        Sign In
                    </button>
                </div>

                <div class="text-center">
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">
                        Don't have an account?
                        <a href="index.html" style="color: var(--accent-primary); font-weight: 600;">Get Started</a>
                    </p>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-light); text-align: center;">
                <p style="color: var(--text-muted); font-size: 0.85rem;">
                    This is a demo interface. Click Sign In to proceed.
                </p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2026 ResumeAI - AI-Powered Resume Analyzer & Career Mentor. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
