<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - AI Resume Analyzer</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
<div class="navbar-container">
<a href="index.html" class="navbar-logo">⚡ ResumeAI</a>

<ul class="navbar-menu">
<li><a href="index.html" class="navbar-link">Home</a></li>
<li><a href="upload.html" class="navbar-link">Upload</a></li>
<li><a href="dashboard.html" class="navbar-link">Dashboard</a></li>
<li><a href="signin.html" class="navbar-link">Sign In</a></li>
<li><a href="signup.html" class="btn btn-primary">Sign Up</a></li>
<li>
    <button id="logoutBtn" class="btn btn-secondary">Logout</button>
</li>
</ul>

</div>
</nav>


<!-- Auth Container -->
<div class="auth-container">

<div class="auth-card fade-in">

<h2 class="auth-title">Create Your Account</h2>
<p class="auth-subtitle">Start analyzing your resume with AI</p>

<form id="signupForm">

<div class="form-group">
<label for="name" class="form-label">Full Name</label>
<input
type="text"
id="name"
class="form-input"
placeholder="Enter your full name"
required
>
</div>

<div class="form-group">
<label for="email" class="form-label">Email Address</label>
<input
type="email"
id="email"
class="form-input"
placeholder="you@example.com"
required
>
</div>

<div class="form-group">
<label for="password" class="form-label">Password</label>
<input
type="password"
id="password"
class="form-input"
placeholder="Create a password"
required
>
</div>

<div class="form-group" style="margin-bottom: 2rem;">
<button type="submit" class="btn btn-primary btn-full" id="signupBtn">
Create Account
</button>
</div>

<div class="text-center">
<p style="color: var(--text-secondary); font-size: 0.9rem;">
Already have an account?
<a href="signin.html" style="color: var(--accent-primary); font-weight: 600;">
Sign In
</a>
</p>
</div>

</form>

</div>

</div>


<!-- Footer -->
<footer class="footer">
<div class="container">
<p class="footer-text">
© 2026 ResumeAI - AI-Powered Resume Analyzer & Career Mentor.
</p>
</div>
</footer>

<script src="js/main.js"></script>

</body>
</html>
